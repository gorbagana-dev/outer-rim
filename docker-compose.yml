# Outer Rim — Hyperlane SVM operator stack (Gorchain ↔ Solana)
#
# Long-running: MinIO, validators, relayer.
# One-shot deploys live in scripts/deploy-core.sh and scripts/deploy-warp.sh.
#
# Images are tagged, not :latest. GHCR (ghcr.io/gorbagana-dev) is private —
# rebuild with scripts/build-images.sh and pin the digest after first pull.
#
# Relayer starts only after both validators are healthy.
# Empty HYP_WHITELIST is deny-all (never relay-everything).
# ISM keys are bind-mounted files (ISM_KEY_FILE); do not interpolate them here.

name: outer-rim

services:
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    hostname: minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks: [outer-rim]

  minio-provision:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z}
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      GORCHAIN_PRIMARY_KEY_ID: ${GORCHAIN_PRIMARY_KEY_ID}
      GORCHAIN_PRIMARY_SECRET: ${GORCHAIN_PRIMARY_SECRET}
      SOLANA_PRIMARY_KEY_ID: ${SOLANA_PRIMARY_KEY_ID}
      SOLANA_PRIMARY_SECRET: ${SOLANA_PRIMARY_SECRET}
    volumes:
      - ./scripts/provision-minio.sh:/provision.sh:ro
    entrypoint: ["/bin/sh", "/provision.sh"]
    networks: [outer-rim]

  validator-gorchain:
    image: ${HYPERLANE_AGENT_IMAGE:-ghcr.io/gorbagana-dev/hyperlane-agent:v2.2.0-gorbagana.1}
    platform: linux/amd64
    user: "0"
    restart: unless-stopped
    hostname: validator-gorchain
    depends_on:
      minio-provision:
        condition: service_completed_successfully
    command: ["/bin/bash", "/scripts/run-validator.sh"]
    environment:
      SIGNER_KEY_FILE: /keys/validator-gorchain.key
      ISM_KEY_FILE: /keys/validator-ism-gorchain.key
      HYP_ORIGINCHAINNAME: gorchain
      HYP_DB: /data/validator
      HYP_CHECKPOINTSYNCER_TYPE: s3
      HYP_CHECKPOINTSYNCER_BUCKET: hyperlane-validator-gorchain-primary
      HYP_CHECKPOINTSYNCER_REGION: us-east-1
      HYP_VALIDATOR_TYPE: hexKey
      HYP_METRICSPORT: "9090"
      CONFIG_FILES: /config/agent-config.json
      HYP_CHAINS_GORCHAIN_CUSTOMRPCURLS: ${GORCHAIN_RPC_URL}
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${GORCHAIN_PRIMARY_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${GORCHAIN_PRIMARY_SECRET}
    volumes:
      - ./state:/config:ro
      - ./keys:/keys:ro
      - ./scripts/run-validator.sh:/scripts/run-validator.sh:ro
      - validator-gorchain-data:/data
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9090' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks: [outer-rim]

  validator-solana:
    image: ${HYPERLANE_AGENT_IMAGE:-ghcr.io/gorbagana-dev/hyperlane-agent:v2.2.0-gorbagana.1}
    platform: linux/amd64
    user: "0"
    restart: unless-stopped
    hostname: validator-solana
    depends_on:
      minio-provision:
        condition: service_completed_successfully
    command: ["/bin/bash", "/scripts/run-validator.sh"]
    environment:
      SIGNER_KEY_FILE: /keys/validator-solana.key
      ISM_KEY_FILE: /keys/validator-ism-solana.key
      HYP_ORIGINCHAINNAME: solana
      HYP_DB: /data/validator
      HYP_CHECKPOINTSYNCER_TYPE: s3
      HYP_CHECKPOINTSYNCER_BUCKET: hyperlane-validator-solana-primary
      HYP_CHECKPOINTSYNCER_REGION: us-east-1
      HYP_VALIDATOR_TYPE: hexKey
      HYP_METRICSPORT: "9090"
      CONFIG_FILES: /config/agent-config.json
      HYP_CHAINS_SOLANA_CUSTOMRPCURLS: ${SOLANA_RPC_URL}
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${SOLANA_PRIMARY_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${SOLANA_PRIMARY_SECRET}
    volumes:
      - ./state:/config:ro
      - ./keys:/keys:ro
      - ./scripts/run-validator.sh:/scripts/run-validator.sh:ro
      - validator-solana-data:/data
    ports:
      - "127.0.0.1:9092:9090"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9090' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks: [outer-rim]

  relayer:
    image: ${HYPERLANE_AGENT_IMAGE:-ghcr.io/gorbagana-dev/hyperlane-agent:v2.2.0-gorbagana.1}
    platform: linux/amd64
    user: "0"
    restart: unless-stopped
    hostname: relayer
    depends_on:
      validator-gorchain:
        condition: service_healthy
      validator-solana:
        condition: service_healthy
    command: ["/bin/bash", "/scripts/run-relayer.sh"]
    environment:
      CONFIG_FILES: /config/agent-config.json
      HYP_CHAINS_GORCHAIN_CUSTOMRPCURLS: ${GORCHAIN_RPC_URL}
      HYP_CHAINS_SOLANA_CUSTOMRPCURLS: ${SOLANA_RPC_URL}
      # Sealevel process_estimate_costs returns zeros; OnChainFeeQuoting does not work.
      # v1 keeps enforcement off. Do not pretend fees are collected.
      HYP_GASPAYMENTENFORCEMENT: '[{"type": "none"}]'
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_REGION: us-east-1
    volumes:
      - ./state:/config:ro
      - ./keys:/keys:ro
      - ./scripts/run-relayer.sh:/scripts/run-relayer.sh:ro
      - relayer-data:/data
    ports:
      - "127.0.0.1:9091:9091"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9091' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks: [outer-rim]

networks:
  outer-rim:
    driver: bridge

volumes:
  minio-data:
  validator-gorchain-data:
  validator-solana-data:
  relayer-data:
