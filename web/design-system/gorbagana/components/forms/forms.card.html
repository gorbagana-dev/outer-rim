<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.475.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--bg-app)}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px 24px}.col{display:flex;flex-direction:column;gap:14px}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.GorbaganaDesignSystem_e5ff07;
function App(){const [net,setNet]=React.useState('main');const [a,setA]=React.useState(true);const [b,setB]=React.useState(false);const [r,setR]=React.useState('fast');const [s1,setS1]=React.useState(true);const [s2,setS2]=React.useState(false);
return <div className="grid">
<div className="col"><Input label="Amount" suffix="$GOR" mono placeholder="0.00" defaultValue="4,444" /><Input iconLeft="search" placeholder="Search tx, block, address…" size="sm" /><Input label="Recipient" defaultValue="71Jvq4…ELvg" mono error="Not a Gorbagana address" /><Input label="Disabled" disabled placeholder="Nope" /></div>
<div className="col"><Select label="Network" value={net} onChange={setNet} options={[{value:'main',label:'Mainnet',icon:'zap'},{value:'test',label:'Testnet',icon:'flask-conical'},{value:'dev',label:'Devnet',icon:'wrench'}]} /><Select label="Body family" placeholder="Pick a family" options={[{value:'bin',label:'Teal bin'},{value:'blue',label:'Blue bin'},{value:'bag',label:'Black bag'}]} /><Select label="Disabled" disabled options={[]} /></div>
<div className="col"><Checkbox checked={a} onChange={setA} label="I understand the chain is trash" description="That's the point." /><Checkbox checked={b} onChange={setB} label="Send me Trash Council minutes" /><Checkbox indeterminate label="Some traits selected" /><Checkbox disabled label="Disabled" /><Radio name="speed" value={r} onChange={setR} options={[{value:'fast',label:'Fast'},{value:'faster',label:'Faster',description:'Priority fee in $GOR'}]} /><Switch checked={s1} onChange={setS1} label="CRT scanlines" /><Switch checked={s2} onChange={setS2} label="Degen mode" size="sm" /></div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
