<!-- @dsCard group="Gorbagana Web" viewport="1280x800" name="Gorbagana web — landing, explorer, gallery" subtitle="Click-through: hero → landfill explorer → Gorbagio gallery with detail dialog" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Gorbagana — web UI kit</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.475.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{background:var(--bg-app);min-height:100vh}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="kit-nav.jsx"></script>
<script type="text/babel" src="kit-landing.jsx"></script>
<script type="text/babel" src="kit-explorer.jsx"></script>
<script type="text/babel" src="kit-gallery.jsx"></script>
<script type="text/babel">
function App(){const [screen,setScreen]=React.useState(localStorage.getItem('gor-kit-screen')||'landing');const [connected,setConnected]=React.useState(false);
const nav=s=>{setScreen(s);localStorage.setItem('gor-kit-screen',s);window.scrollTo(0,0)};
return <div data-screen-label={screen}><TopNav screen={screen} onNav={nav} connected={connected} onConnect={()=>setConnected(true)} />{screen==='landing'&&<Landing onNav={nav}/>}{screen==='explorer'&&<Explorer/>}{screen==='gallery'&&<Gallery/>}<Footer/></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
