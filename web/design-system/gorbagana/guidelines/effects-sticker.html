<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-primary);font:var(--type-body)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--white-12)}.n{font:var(--type-mono);font-size:11px;color:var(--text-secondary)}.v{font:var(--type-mono);font-size:10px;color:var(--text-muted)}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}</style></head><body><div class="row" style="gap:28px;padding:8px 12px"><div class="s" style="align-items:center"><div style="padding:10px 14px;background:var(--surface-sticker);color:var(--ink-900);border:2px solid var(--ink-900);box-shadow:var(--shadow-sticker);transform:rotate(var(--tilt-1));font:var(--type-sticker);text-transform:uppercase;white-space:nowrap">Trash people</div><div class="v" style="margin-top:6px">--shadow-sticker · --tilt-1</div></div><div class="s" style="align-items:center"><div style="padding:10px 14px;background:var(--surface-sticker);color:var(--ink-900);border:2px solid var(--ink-900);box-shadow:var(--shadow-sticker-lg);transform:rotate(var(--tilt-2));font:var(--type-sticker);text-transform:uppercase;white-space:nowrap">Better people</div><div class="v" style="margin-top:6px">--shadow-sticker-lg · --tilt-2</div></div><div class="s" style="align-items:center"><div style="padding:10px 14px;background:var(--surface-sticker);color:var(--ink-900);border:2px solid var(--ink-900);box-shadow:var(--shadow-sticker);transform:rotate(var(--tilt-3));font:var(--type-sticker);text-transform:uppercase;white-space:nowrap">Built by degens</div><div class="v" style="margin-top:6px">--shadow-sticker · --tilt-3</div></div><div class="s" style="align-items:center"><div style="padding:10px 14px;background:var(--surface-sticker);color:var(--ink-900);border:2px solid var(--ink-900);box-shadow:var(--shadow-sticker-lg);transform:rotate(var(--tilt-4));font:var(--type-sticker);text-transform:uppercase;white-space:nowrap">For dreamers</div><div class="v" style="margin-top:6px">--shadow-sticker-lg · --tilt-4</div></div></div></body></html>
