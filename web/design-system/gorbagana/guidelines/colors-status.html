<!-- @dsCard group="Colors" viewport="700x150" name="Status colors" subtitle="Success / danger / warning / info, each with a 12% tint background" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-primary);font:var(--type-body)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--white-12)}.n{font:var(--type-mono);font-size:11px;color:var(--text-secondary)}.v{font:var(--type-mono);font-size:10px;color:var(--text-muted)}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}</style></head><body><div class="row" style="gap:12px"><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--status-success-bg);border:1px solid var(--status-success);color:var(--status-success);font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase"><span style="width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor"></span>Confirmed</div><div class="n">--status-success</div><div class="v">--status-success-bg</div></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--status-danger-bg);border:1px solid var(--status-danger);color:var(--status-danger);font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase"><span style="width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor"></span>Dumped</div><div class="n">--status-danger</div><div class="v">--status-danger-bg</div></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--status-warning-bg);border:1px solid var(--status-warning);color:var(--status-warning);font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase"><span style="width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor"></span>Low gas</div><div class="n">--status-warning</div><div class="v">--status-warning-bg</div></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--status-info-bg);border:1px solid var(--status-info);color:var(--status-info);font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase"><span style="width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor"></span>Bridging</div><div class="n">--status-info</div><div class="v">--status-info-bg</div></div></div></body></html>
