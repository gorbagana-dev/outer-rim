<!-- @dsCard group="Effects" viewport="700x170" name="Backgrounds: grid, scanlines, elevated" subtitle="Perspective grid for heroes, scanlines as an optional CRT overlay, elevated shadow for menus" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-primary);font:var(--type-body)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--white-12)}.n{font:var(--type-mono);font-size:11px;color:var(--text-secondary)}.v{font:var(--type-mono);font-size:10px;color:var(--text-muted)}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}</style></head><body><div class="row" style="align-items:stretch;gap:14px"><div style="flex:1;height:130px;background:var(--void-1);background-image:var(--bg-grid);background-size:32px 32px;border-radius:var(--radius-md);border:1px solid var(--border-default);position:relative"><div class="v" style="position:absolute;left:8px;bottom:6px">--bg-grid · --bg-grid-size</div></div><div style="flex:1;height:130px;background:var(--void-2);background-image:var(--bg-scanlines);border-radius:var(--radius-md);border:1px solid var(--border-default);position:relative"><div class="v" style="position:absolute;left:8px;bottom:6px">--bg-scanlines (opt-in)</div></div><div style="flex:1;height:130px;background:var(--void-3);border-radius:var(--radius-md);box-shadow:var(--shadow-elevated);position:relative"><div class="v" style="position:absolute;left:8px;bottom:6px">--shadow-elevated (menus)</div></div></div></body></html>
