<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-primary);font:var(--type-body)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--white-12)}.n{font:var(--type-mono);font-size:11px;color:var(--text-secondary)}.v{font:var(--type-mono);font-size:10px;color:var(--text-muted)}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}</style></head><body><div class="sw" style="grid-template-columns:repeat(8,1fr)"><div class="s"><div class="chip" style="background:var(--paper-100);"></div><div class="n">--paper-100</div><div class="v">#F1EADB sticker</div></div><div class="s"><div class="chip" style="background:var(--paper-300);"></div><div class="n">--paper-300</div><div class="v">#CFC3A8</div></div><div class="s"><div class="chip" style="background:var(--card-500);"></div><div class="n">--card-500</div><div class="v">#B8894F cardboard</div></div><div class="s"><div class="chip" style="background:var(--card-700);"></div><div class="n">--card-700</div><div class="v">#7A5630</div></div><div class="s"><div class="chip" style="background:var(--bin-400);"></div><div class="n">--bin-400</div><div class="v">#6B7080</div></div><div class="s"><div class="chip" style="background:var(--bin-600);"></div><div class="n">--bin-600</div><div class="v">#33363F bin</div></div><div class="s"><div class="chip" style="background:var(--fur-700);"></div><div class="n">--fur-700</div><div class="v">#2F6B1F fur</div></div><div class="s"><div class="chip" style="background:var(--ink-900);"></div><div class="n">--ink-900</div><div class="v">#0B0712 ink</div></div></div></body></html>
