<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-primary);font:var(--type-body)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--white-12)}.n{font:var(--type-mono);font-size:11px;color:var(--text-secondary)}.v{font:var(--type-mono);font-size:10px;color:var(--text-muted)}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.sp{display:flex;align-items:baseline;gap:16px;border-bottom:1px dashed var(--border-subtle);padding:6px 0}.sp .n{width:150px;flex-shrink:0}</style></head><body><div class="row"><span style="font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-secondary)">Section label</span><span style="font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--pink-500)">Eyebrow · pink</span><span style="font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--acid-500);text-shadow:var(--text-glow-acid)">Active tab</span><span style="font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)">Muted meta</span></div><div class="row" style="margin-top:14px"><span class="n">--type-label</span><span class="v">700 11px/1 Space Grotesk · --tracking-caps 0.14em · text-transform: uppercase</span></div></body></html>
