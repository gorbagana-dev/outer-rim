<!-- @dsCard group="Colors" viewport="700x170" name="Sunset & grid" subtitle="The only sanctioned gradients: striped synthwave sun and the purple perspective grid" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-primary);font:var(--type-body)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--white-12)}.n{font:var(--type-mono);font-size:11px;color:var(--text-secondary)}.v{font:var(--type-mono);font-size:10px;color:var(--text-muted)}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}</style></head><body><div class="row" style="align-items:stretch"><div style="position:relative;width:200px;height:130px;background:var(--gradient-void);border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-default)"><div style="position:absolute;left:50%;top:18px;width:96px;height:96px;margin-left:-48px;border-radius:50%;background:var(--gradient-sunset)"></div><div style="position:absolute;left:50%;top:18px;width:96px;height:96px;margin-left:-48px;border-radius:50%;background:var(--gradient-sunset-stripes)"></div><div style="position:absolute;inset:auto 0 0 0;height:56px;background-image:var(--bg-grid);background-size:24px 24px;transform:perspective(120px) rotateX(45deg);transform-origin:bottom"></div></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div class="n">--gradient-sunset <span class="v">#FF2DAA → #FF3C7E → #FF8A3D</span></div><div class="n">--gradient-sunset-stripes <span class="v">repeating 14/4px void bands</span></div><div class="n">--bg-grid + --grid-line <span class="v">1px rgba(154,77,255,.45) · 48px cells</span></div><div class="n">--gradient-void <span class="v">#2A1749 → #0D0619, page hero only</span></div><div class="n">--gradient-acid-pink <span class="v">rules / dividers only, never fills</span></div></div></div></body></html>
