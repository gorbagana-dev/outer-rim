<!-- @dsCard group="Colors" viewport="700x150" name="Text colors" subtitle="Four tiers on void; ink on paper and acid" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-primary);font:var(--type-body)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--white-12)}.n{font:var(--type-mono);font-size:11px;color:var(--text-secondary)}.v{font:var(--type-mono);font-size:10px;color:var(--text-muted)}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}</style></head><body><div class="row" style="gap:24px;align-items:stretch"><div style="flex:1;display:flex;flex-direction:column;gap:6px;padding:14px;background:var(--surface-1);border:1px solid var(--border-default);border-radius:var(--radius-md)"><div style="color:var(--text-primary)">Primary — #F4F0FF <span class="v">--text-primary</span></div><div style="color:var(--text-secondary)">Secondary — #B9AFD1 <span class="v">--text-secondary</span></div><div style="color:var(--text-muted)">Muted — #7C7096 <span class="v">--text-muted</span></div><div><a href="#">Link — cyan, wavy underline on hover</a> <span class="v">--text-link</span></div></div><div style="display:flex;flex-direction:column;gap:8px;width:200px"><div style="padding:12px;background:var(--surface-sticker);color:var(--text-on-sticker);font:var(--type-sticker);border:2px solid var(--ink-900);box-shadow:var(--shadow-sticker)">Ink on paper</div><div style="padding:12px;background:var(--acid-500);color:var(--text-on-acid);font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;text-align:center">Ink on acid</div></div></div></body></html>
