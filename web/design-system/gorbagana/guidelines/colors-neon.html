<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-primary);font:var(--type-body)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--white-12)}.n{font:var(--type-mono);font-size:11px;color:var(--text-secondary)}.v{font:var(--type-mono);font-size:10px;color:var(--text-muted)}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}</style></head><body><div class="sw" style="grid-template-columns:repeat(8,1fr)"><div class="s"><div class="chip" style="background:var(--acid-500);box-shadow:var(--glow-acid)"></div><div class="n">--acid-500</div><div class="v">#39FF14 · primary</div></div><div class="s"><div class="chip" style="background:var(--acid-400);"></div><div class="n">--acid-400</div><div class="v">#7CFF4A hover</div></div><div class="s"><div class="chip" style="background:var(--acid-600);"></div><div class="n">--acid-600</div><div class="v">#22C40E active</div></div><div class="s"><div class="chip" style="background:var(--pink-500);box-shadow:var(--glow-pink)"></div><div class="n">--pink-500</div><div class="v">#FF2DAA · secondary</div></div><div class="s"><div class="chip" style="background:var(--pink-400);"></div><div class="n">--pink-400</div><div class="v">#FF5EC2</div></div><div class="s"><div class="chip" style="background:var(--cyan-500);box-shadow:var(--glow-cyan)"></div><div class="n">--cyan-500</div><div class="v">#19E6FF · links/focus</div></div><div class="s"><div class="chip" style="background:var(--yellow-500);box-shadow:var(--glow-yellow)"></div><div class="n">--yellow-500</div><div class="v">#F5FF3D · crowns</div></div><div class="s"><div class="chip" style="background:var(--sunset-600);"></div><div class="n">--sunset-600</div><div class="v">#FF1E6B · danger</div></div></div></body></html>
