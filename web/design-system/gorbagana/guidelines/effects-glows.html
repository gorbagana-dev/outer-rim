<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-primary);font:var(--type-body)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--white-12)}.n{font:var(--type-mono);font-size:11px;color:var(--text-secondary)}.v{font:var(--type-mono);font-size:10px;color:var(--text-muted)}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}</style></head><body><div class="row" style="gap:20px;padding:10px"><div class="s" style="align-items:center"><div style="width:64px;height:48px;border-radius:var(--radius-sm);border:2px solid var(--acid-500);box-shadow:var(--glow-acid);background:var(--surface-1)"></div><div class="v">--glow-acid</div></div><div class="s" style="align-items:center"><div style="width:64px;height:48px;border-radius:var(--radius-sm);border:2px solid var(--acid-500);box-shadow:var(--glow-acid-strong);background:var(--surface-1)"></div><div class="v">--glow-acid-strong</div></div><div class="s" style="align-items:center"><div style="width:64px;height:48px;border-radius:var(--radius-sm);border:2px solid var(--pink-500);box-shadow:var(--glow-pink);background:var(--surface-1)"></div><div class="v">--glow-pink</div></div><div class="s" style="align-items:center"><div style="width:64px;height:48px;border-radius:var(--radius-sm);border:2px solid var(--pink-500);box-shadow:var(--glow-pink-strong);background:var(--surface-1)"></div><div class="v">--glow-pink-strong</div></div><div class="s" style="align-items:center"><div style="width:64px;height:48px;border-radius:var(--radius-sm);border:2px solid var(--cyan-500);box-shadow:var(--glow-cyan);background:var(--surface-1)"></div><div class="v">--glow-cyan</div></div><div class="s" style="align-items:center"><div style="width:64px;height:48px;border-radius:var(--radius-sm);border:2px solid var(--purple-400);box-shadow:var(--glow-purple);background:var(--surface-1)"></div><div class="v">--glow-purple</div></div><div class="s" style="align-items:center"><div style="width:64px;height:48px;border-radius:var(--radius-sm);border:2px solid var(--yellow-500);box-shadow:var(--glow-yellow);background:var(--surface-1)"></div><div class="v">--glow-yellow</div></div></div></body></html>
