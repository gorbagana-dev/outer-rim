<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-primary);font:var(--type-body)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--white-12)}.n{font:var(--type-mono);font-size:11px;color:var(--text-secondary)}.v{font:var(--type-mono);font-size:10px;color:var(--text-muted)}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}</style></head><body><div style="display:flex;gap:16px"><div style="width:300px;background:var(--surface-1);border:1px solid var(--border-default);border-radius:var(--radius-md)"><div style="padding:12px 20px;border-bottom:1px solid var(--border-subtle);font:var(--type-label);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)">Validator · 12/20</div><div style="padding:20px;display:flex;flex-direction:column;gap:8px"><div style="height:12px;width:60%;background:var(--white-12);border-radius:2px"></div><div style="height:12px;width:80%;background:var(--white-6);border-radius:2px"></div><div style="display:flex;gap:8px;margin-top:8px"><div style="height:40px;flex:1;background:var(--acid-500);border-radius:var(--radius-sm)"></div><div style="height:40px;flex:1;border:2px solid var(--pink-500);border-radius:var(--radius-sm)"></div></div></div></div><div style="display:flex;flex-direction:column;gap:6px;justify-content:center"><div class="n">padding <span class="v">--space-5 20px body · --space-3 12px header</span></div><div class="n">gap <span class="v">--space-2 8px stack · --space-4 16px between cards</span></div><div class="n">controls <span class="v">--control-md 40px · --control-sm 32 · --control-lg 48</span></div><div class="n">borders <span class="v">1px hairline surfaces · 2px controls & neon</span></div></div></div></body></html>
