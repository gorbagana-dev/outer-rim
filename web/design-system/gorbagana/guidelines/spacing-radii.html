<!-- @dsCard group="Spacing" viewport="700x140" name="Corner radii" subtitle="Tight corners: 2px stickers, 4px controls, 6px cards, 10px dialogs. Pill only for chips and switches." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-primary);font:var(--type-body)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--white-12)}.n{font:var(--type-mono);font-size:11px;color:var(--text-secondary)}.v{font:var(--type-mono);font-size:10px;color:var(--text-muted)}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}</style></head><body><div class="row" style="gap:14px"><div class="s" style="align-items:center"><div style="width:72px;height:56px;border-radius:var(--radius-xs);border:2px solid var(--pink-500);background:var(--surface-2)"></div><div class="n">--radius-xs</div><div class="v">2px</div></div><div class="s" style="align-items:center"><div style="width:72px;height:56px;border-radius:var(--radius-sm);border:2px solid var(--pink-500);background:var(--surface-2)"></div><div class="n">--radius-sm</div><div class="v">4px</div></div><div class="s" style="align-items:center"><div style="width:72px;height:56px;border-radius:var(--radius-md);border:2px solid var(--pink-500);background:var(--surface-2)"></div><div class="n">--radius-md</div><div class="v">6px</div></div><div class="s" style="align-items:center"><div style="width:72px;height:56px;border-radius:var(--radius-lg);border:2px solid var(--pink-500);background:var(--surface-2)"></div><div class="n">--radius-lg</div><div class="v">10px</div></div><div class="s" style="align-items:center"><div style="width:72px;height:56px;border-radius:var(--radius-xl);border:2px solid var(--pink-500);background:var(--surface-2)"></div><div class="n">--radius-xl</div><div class="v">16px</div></div><div class="s" style="align-items:center"><div style="width:72px;height:56px;border-radius:var(--radius-pill);border:2px solid var(--pink-500);background:var(--surface-2)"></div><div class="n">--radius-pill</div><div class="v">999px</div></div></div></body></html>
